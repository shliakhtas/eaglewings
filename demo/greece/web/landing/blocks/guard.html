      <span class="label">Що бережемо</span>
      <h2 style="margin-top:12px">Три парки, <em>які важливо зберегти</em></h2>
      <p class="sub">Три різні світи на сході Греції: старі дубово-соснові ліси Дадьї з чорними грифами, дельта Евросу й дельта Несту з озерами, де зупиняються й зимують водоплавні птахи. Вогонь і рубки загрожують усім трьом.</p>
      <div class="people">
        <figure class="person"><img src="assets/photo_vulture_viewpoint.jpg" alt="Оглядовий пункт годівлі грифів у Дадьї" loading="lazy"><span class="cr">Héctor Ochoa · CC BY-SA 4.0</span><figcaption><span class="label">Дадья–Лефкімі–Суфлі</span><b>Ліс чорного грифа</b><p>Одна з найбагатших на хижих птахів місцевостей Європи й притулок чорного грифа. Ліс укриває 60 % парку; пожежа 2023 року пройшла через гніздові ліси грифів.</p></figcaption></figure>
        <figure class="person"><img src="assets/photo_evros_delta.jpg" alt="Протока в дельті Евросу з човнами й прибережним лісом" loading="lazy"><span class="cr">Spiros1964 · CC BY-SA 4.0</span><figcaption><span class="label">«Дельта Евросу»</span><b>Дельта на кордоні</b><p>Водно-болотне угіддя Рамсарської конвенції: протоки, лагуни й плавні, де зупиняються й зимують водоплавні птахи. Ліс тут лише 6 % площі, тож кожен гай на рахунку.</p></figcaption></figure>
        <figure class="person"><img src="assets/photo_nestos_flamingos.jpg" alt="Фламінго в дельті Несту" loading="lazy"><span class="cr">Zsolyomi · CC BY-SA 4.0</span><figcaption><span class="label">«Східна Македонія й Фракія»</span><b>Дельта Несту й озера</b><p>Дельта Несту, озера Вістоніда й Ісмарида — теж Рамсарські угіддя. Найбільший із трьох парків: 95 тис. га, з них ліс 2 %, і 512 теплових точок за 2021–2025.</p></figcaption></figure>
